apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition

metadata:
  name: mysqldatabases.platform.example.com

spec:
  group: platform.example.com

  names:
    kind: MySQLDatabase
    plural: mysqldatabases
    singular: mysqldatabase
    shortNames:
      - mysql

  scope: Namespaced

  versions:
    - name: v1
      served: true
      storage: true

      schema:
        openAPIV3Schema:
          type: object

          properties:

            spec:
              type: object

              properties:

                version:
                  type: string

                replicas:
                  type: integer
                  minimum: 1

                storage:
                  type: string

              required:
                - version
                - replicas
                - storage