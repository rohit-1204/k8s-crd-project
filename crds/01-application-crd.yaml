apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition

metadata:
  name: applications.platform.example.com

spec:
  group: platform.example.com

  names:
    kind: Application
    plural: applications
    singular: application
    shortNames:
      - app

  scope: Namespaced

  versions:
    - name: v1
      served: true
      storage: true

      schema:
        openAPIV3Schema:
          type: object

          properties:

            spec:
              type: object

              properties:

                image:
                  type: string

                replicas:
                  type: integer
                  minimum: 1

                port:
                  type: integer

              required:
                - image
                - replicas
                - port